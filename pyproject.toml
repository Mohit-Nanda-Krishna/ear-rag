[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ear-rag"
version = "0.1.0"
description = "Evidence-aware adaptive retrieval research prototype"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ear_rag*"]
namespaces = false
