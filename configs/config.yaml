project:
  name: EAR-RAG
  version: 0.1.0

data:
  dataset: fixture
  subset: development
  split: train
  maximum_examples: null
  paths:
    raw: data/raw
    processed: data/processed
    indexes: data/indexes
    fixture_file: data/fixtures/tiny_retrieval.jsonl

query_analysis:
  enabled: true
  policy: query_features_v1
  fallback_backend: local_lexical
  eligible_backends: [local_lexical, vector_flat, hybrid, multihop]
  minimum_score: 1.0
  minimum_margin: 0.25
  tie_break_order: [local_lexical, vector_flat, hybrid, multihop]
  # Provisional heuristic suitability scores, not probabilities or measured quality.
  weights:
    local_lexical: {exact_anchor: 4.0}
    vector_flat: {conceptual: 3.0}
    hybrid: {exact_anchor: 1.0, conceptual: 1.0, mixed: 4.0}
    multihop: {dependent: 8.0}

retrieval:
  backend: local_lexical
  default_top_k: 5
  max_top_k: 20
  chunk_size: 400
  chunk_overlap: 50

vector:
  dimensions: 64

hybrid:
  lexical_weight: 0.5
  vector_weight: 0.5

multihop:
  max_hops: 2

chunking:
  size: 400
  overlap: 50

evidence_assessment:
  sufficient_threshold: 0.7
  uncertain_threshold: 0.4
  weights:
    relevance: 0.25
    coverage: 0.25
    support: 0.25
    consistency: 0.25

recovery:
  max_recovery_rounds: 1
  # Compatibility alias retained for earlier configuration consumers.
  max_attempts: 1
  max_retrieved_chunks: 20
  recovery_backends:
    # Candidate allow-list; CAS ranks executable, suitable, unattempted actions.
    default: [local_lexical, vector_flat, hybrid, multihop]
  cost_awareness:
    policy: evidence_sufficiency_cas_v1
    # Strict CAS > threshold; engineering operating value, not calibrated.
    cost_efficiency_threshold: 1.0
    # Nominal NEXT-action work, not future ESA/quality predictions. Chunks mean
    # final returned context chunks (not child passages or processed chunks).
    # Latency constants are assumptions, not measurements or a latency model.
    # Cost=max(.05*calls+.01*chunks+.001*latency_ms,.05), abstract work units.
    incremental_work:
      local_lexical:
        retrieval_calls: 1
        retrieved_chunks: 5
        latency_ms: 10
      vector_flat:
        retrieval_calls: 1
        retrieved_chunks: 5
        latency_ms: 10
      hybrid:
        retrieval_calls: 2
        retrieved_chunks: 5
        latency_ms: 20
      multihop:
        # Reserved call budget = configured max_hops; execution can stop early.
        retrieval_calls: 2
        retrieved_chunks: 5
        latency_ms: 20

generation:
  enabled: false

models:
  generator: null

evaluation:
  enabled: false

logging:
  level: INFO

persistence:
  enabled: true
  processed_path: data/processed
  index_path: data/indexes
